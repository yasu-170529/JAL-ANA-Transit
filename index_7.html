<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAL・ANA 乗り継ぎ旅程ビルダー</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f0;min-height:100vh}
.page{max-width:720px;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-size:18px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.subtitle{font-size:12px;color:#888;margin-bottom:1.5rem}
section{margin-bottom:1.25rem}
.sec-title{font-size:11px;font-weight:600;color:#888;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.card{background:#fff;border:0.5px solid #e0e0d8;border-radius:12px;padding:1rem 1.25rem}
.itin-empty{color:#aaa;font-size:13px;text-align:center;padding:1.25rem 0}
.leg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid #f0f0ea}
.leg-row:last-child{border-bottom:none}
.leg-num{font-size:11px;color:#aaa;min-width:18px}
.leg-al{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;min-width:38px;text-align:center}
.al-jal,.al-jta,.al-jac,.al-rac{background:#fff0ec;color:#b83a1a}
.al-ana,.al-ajx{background:#e8f2fc;color:#1259a0}
.leg-flight{font-size:12px;color:#999;min-width:70px}
.leg-route{flex:1;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.leg-ap{font-size:13px;font-weight:600}
.leg-time{font-size:12px;color:#888}
.transit-info{font-size:11px;color:#aaa;padding:3px 0 3px 28px;display:flex;align-items:center;gap:4px}
.itin-summary{margin-top:10px;padding-top:10px;border-top:0.5px solid #f0f0ea;font-size:12px;color:#999;display:flex;gap:14px;flex-wrap:wrap}
.itin-summary span{display:flex;align-items:center;gap:4px}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font-size:13px;padding:6px 14px;border:0.5px solid #d0d0c8;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:5px;color:#1a1a1a}
.btn:hover{background:#f5f5f0}
.btn-danger{border-color:#f0a090;color:#993c1d}
.btn-danger:hover{background:#fff0ec}
.btn-complete{border-color:#85b7eb;color:#185fa5;font-weight:500}
.btn-complete:hover{background:#e8f2fc}
.al-toggle-row{display:flex;gap:8px;margin-bottom:12px}
.al-toggle{flex:1;padding:7px 4px;border-radius:8px;border:0.5px solid #d0d0c8;background:#fff;cursor:pointer;font-size:13px;font-weight:600;text-align:center;color:#666}
.al-toggle:hover{background:#f5f5f0}
.al-toggle.active-jal{background:#fff0ec;border-color:#f0a090;color:#b83a1a}
.al-toggle.active-ana{background:#e8f2fc;border-color:#85b7eb;color:#1259a0}
.al-toggle.active-both{background:#eaf5e0;border-color:#a8d878;color:#336611}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:#888}
select,input[type=date]{width:100%;padding:7px 10px;border:0.5px solid #d0d0c8;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;-webkit-appearance:none;appearance:none}
select:disabled,input:disabled{color:#aaa;background:#f5f5f0}
.btn-search{width:100%;justify-content:center;font-weight:600;padding:9px;background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-search:hover{background:#333}
.step-label{font-size:12px;font-weight:600;margin-bottom:10px;color:#333}
.loading{text-align:center;padding:1.5rem;color:#aaa;font-size:13px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.result-item{padding:9px 12px;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:8px;margin-bottom:5px;border:0.5px solid #e0e0d8;background:#fff;transition:all .1s}
.result-item:hover{border-color:#999;background:#fafaf8}
.ri-right{text-align:right;white-space:nowrap;flex-shrink:0}
.ri-times{font-size:13px;font-weight:600}
.ri-sub{font-size:11px;color:#aaa;margin-top:2px}
.no-result{color:#aaa;font-size:13px;padding:8px 0;line-height:1.7}
.err{color:#b83a1a;font-size:13px;line-height:1.7;background:#fff0ec;border-radius:8px;padding:10px 12px}
.booking-section{margin-top:14px;padding-top:14px;border-top:0.5px solid #f0f0ea}
.booking-title{font-size:12px;font-weight:600;color:#666;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.booking-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0.5px solid #e0e0d8;margin-bottom:6px;text-decoration:none;color:#1a1a1a;background:#fff;transition:all .1s}
.booking-link:hover{background:#fafaf8;border-color:#999}
.booking-link-jal{border-left:3px solid #d85a30}
.booking-link-ana{border-left:3px solid #378add}
.bl-info{flex:1;min-width:0}
.bl-route{font-size:13px;font-weight:600}
.bl-meta{font-size:11px;color:#aaa;margin-top:2px}
.bl-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.bl-badge-jal{background:#fff0ec;color:#b83a1a}
.bl-badge-ana{background:#e8f2fc;color:#1259a0}
.bl-icon{color:#ccc;font-size:14px;flex-shrink:0}
.notice{font-size:11px;color:#aaa;margin-top:10px;padding:8px 10px;background:#f5f5f0;border-radius:8px;line-height:1.6}
</style>
</head>
<body>
<div class="page">
  <h1><i class="ti ti-plane" style="color:#1a1a1a"></i> JAL・ANA 乗り継ぎ旅程ビルダー</h1>
  <p class="subtitle">ODPT公式時刻表データ使用 ／ MCT（最低乗継時間）考慮</p>

  <section>
    <div class="sec-title">作成された旅程</div>
    <div class="card">
      <div id="itin-list"><div class="itin-empty">便を選択すると旅程が表示されます</div></div>
      <div id="itin-summary" style="display:none" class="itin-summary"></div>
      <div id="booking-section" style="display:none" class="booking-section">
        <div class="booking-title"><i class="ti ti-ticket"></i> 各区間の予約ページ</div>
        <div id="booking-links"></div>
        <div class="notice"><i class="ti ti-info-circle"></i> 各航空会社の検索ページが新しいタブで開きます。便名・時刻はご自身でご確認のうえ予約してください。</div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="resetTool()"><i class="ti ti-refresh"></i> 新しい検索</button>
        <button class="btn btn-danger" id="btn-back" onclick="goBack()" style="display:none"><i class="ti ti-arrow-left"></i> 前の区間に戻る</button>
        <button class="btn btn-complete" id="btn-complete" onclick="completeItin()" style="display:none"><i class="ti ti-check"></i> 旅程を完了・予約へ</button>
        <button class="btn" id="btn-copy" onclick="copyItin()" style="display:none"><i class="ti ti-copy"></i> 旅程をコピー</button>
      </div>
    </div>
  </section>

  <section id="search-section">
    <div class="sec-title">便の検索</div>
    <div class="card">
      <div id="step-label" class="step-label">第1便 — 検索条件を入力してください</div>
      <div class="al-toggle-row">
        <button class="al-toggle active-jal" id="tog-jal" onclick="setAirline('JAL')">JALグループ</button>
        <button class="al-toggle" id="tog-ana" onclick="setAirline('ANA')">ANAグループ</button>
        <button class="al-toggle" id="tog-both" onclick="setAirline('BOTH')">JAL＆ANA</button>
      </div>
      <div class="form-grid">
        <div class="field"><label>出発空港</label><select id="sel-from"></select></div>
        <div class="field"><label>到着空港</label><select id="sel-to"></select></div>
      </div>
      <div class="form-grid">
        <div class="field"><label>出発日</label><input type="date" id="sel-date"></div>
        <div class="field"><label>出発時刻（以降）</label><select id="sel-time"></select></div>
      </div>
      <button class="btn btn-search" onclick="searchFlights()"><i class="ti ti-search"></i> フライトを検索開始</button>
    </div>
  </section>

  <section id="results-section" style="display:none">
    <div class="sec-title" id="results-title">利用可能なフライト</div>
    <div class="card" id="results-card"></div>
  </section>
</div>

<script>
// =====================================================
// ★ JALアフィリエイト設定（後日書き換えてください）
const JAL_AFF_PARAM = '';
const JAL_AFF_VALUE = '';
// =====================================================

const AIRPORTS = [
  {code:'HND',name:'東京（羽田）',mct:30},{code:'NRT',name:'東京（成田）',mct:30},
  {code:'CTS',name:'札幌（新千歳）',mct:20},{code:'OKD',name:'札幌（丘珠）',mct:20},
  {code:'HKD',name:'函館',mct:20},{code:'AXT',name:'秋田',mct:20},
  {code:'SDJ',name:'仙台',mct:20},{code:'KIJ',name:'新潟',mct:20},
  {code:'NGO',name:'名古屋（中部）',mct:20},{code:'ITM',name:'大阪（伊丹）',mct:20},
  {code:'KIX',name:'大阪（関西）',mct:20},{code:'HIJ',name:'広島',mct:20},
  {code:'OKJ',name:'岡山',mct:20},{code:'TAK',name:'高松',mct:20},
  {code:'MYJ',name:'松山',mct:20},{code:'FUK',name:'福岡',mct:20},
  {code:'KMJ',name:'熊本',mct:20},{code:'OIT',name:'大分',mct:20},
  {code:'KOJ',name:'鹿児島',mct:20},{code:'NGS',name:'長崎',mct:20},
  {code:'KMI',name:'宮崎',mct:20},{code:'OKA',name:'沖縄（那覇）',mct:30},
  {code:'ISG',name:'石垣',mct:20},{code:'MMY',name:'宮古',mct:20},
  {code:'WKJ',name:'稚内',mct:20},{code:'MBE',name:'紋別',mct:20},
  {code:'MMB',name:'女満別',mct:20},{code:'AKJ',name:'旭川',mct:20},
  {code:'SHB',name:'根室中標津',mct:20},{code:'KUH',name:'釧路',mct:20},
  {code:'OBO',name:'帯広',mct:20},{code:'RIS',name:'利尻',mct:20},
  {code:'OIR',name:'奥尻',mct:20},{code:'SHI',name:'下地島',mct:20},
  {code:'MSJ',name:'三沢',mct:20},{code:'AOJ',name:'青森',mct:20},
  {code:'KCZ',name:'高知',mct:20},{code:'TKS',name:'徳島',mct:20},
  {code:'UBJ',name:'山口宇部',mct:20},{code:'AMM',name:'奄美大島',mct:20},
  {code:'TKN',name:'徳之島',mct:20},{code:'OKE',name:'沖永良部',mct:20},
  {code:'TRA',name:'多良間',mct:20},{code:'OGN',name:'与那国',mct:20},
];

const JAL_ALS = ['JAL','JTA','JAC','RAC'];
const ANA_ALS = ['ANA','AJX'];
const DAY_MAP = {'Sunday':0,'Monday':1,'Tuesday':2,'Wednesday':3,'Thursday':4,'Friday':5,'Saturday':6};

let scheduleCache = {};
let itinerary = [], legNum = 1, lastArrMin = 0;
let airlineMode = 'JAL', searchDate = '', completed = false;

function getAP(c){ return AIRPORTS.find(a=>a.code===c)||{code:c,name:c,mct:20}; }
function toMin(t){ if(!t)return 0; const[h,m]=t.split(':').map(Number); return h*60+m; }
function fromMin(m){ const mm=((m%1440)+1440)%1440; return String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0'); }
function isJAL(al){ return JAL_ALS.includes(al); }
function alCls(al){ return 'al-'+(isJAL(al)?al.toLowerCase():'ana'); }

function setAirline(mode){
  airlineMode=mode;
  ['jal','ana','both'].forEach(k=>document.getElementById('tog-'+k).className='al-toggle');
  const map={JAL:'jal',ANA:'ana',BOTH:'both'};
  document.getElementById('tog-'+map[mode]).classList.add('active-'+map[mode]);
}

async function fetchSchedule(operator){
  if(scheduleCache[operator]) return scheduleCache[operator];
  const res = await fetch(`/api/flight?operator=${operator}`);
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.error||`APIエラー (${res.status})`);
  }
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  const arr = Array.isArray(data) ? data : [];
  scheduleCache[operator] = arr;
  return arr;
}

function filterFlights(data, fromAP, toAP, afterMin, dateStr){
  const dow = new Date(dateStr).getDay();
  return data.filter(f=>{
    if(!f || !f.from || !f.dep) return false;
    if(fromAP!=='ALL' && f.from!==fromAP) return false;
    if(toAP!=='ALL' && f.to!==toAP) return false;
    if((f.depMin||0) < afterMin) return false;
    // 有効期間チェック
    if(f.validFrom && new Date(dateStr) < new Date(f.validFrom)) return false;
    if(f.validTo && new Date(dateStr) > new Date(f.validTo)) return false;
    // カレンダーチェック
    const cal = f.calendar || 'Everyday';
    if(['Everyday','Daily',''].includes(cal)) return true;
    if(cal==='Weekday') return dow>=1&&dow<=5;
    if(['SaturdayHoliday','Weekend'].includes(cal)) return dow===0||dow===6;
    if(DAY_MAP.hasOwnProperty(cal)) return DAY_MAP[cal]===dow;
    return true;
  });
}

async function searchFlights(){
  searchDate = document.getElementById('sel-date').value;
  if(!searchDate){ alert('出発日を選択してください'); return; }
  const from = document.getElementById('sel-from').value;
  const to = document.getElementById('sel-to').value;
  const afterMin = toMin(document.getElementById('sel-time').value);
  const lbl = {JAL:'JALグループ',ANA:'ANAグループ',BOTH:'JAL＆ANA'}[airlineMode];

  document.getElementById('results-title').textContent = `利用可能なフライト（${lbl}）`;
  document.getElementById('results-section').style.display = '';
  document.getElementById('results-card').innerHTML = '<div class="loading"><i class="ti ti-loader-2 spin"></i><br>時刻表を取得中...</div>';
  document.getElementById('results-section').scrollIntoView({behavior:'smooth',block:'start'});

  try{
    const ops = airlineMode==='JAL'?['JAL']:airlineMode==='ANA'?['ANA']:['JAL','ANA'];
    let flights = [];
    for(const op of ops){
      const raw = await fetchSchedule(op);
      flights = flights.concat(filterFlights(raw, from, to, afterMin, searchDate));
    }
    const seen = new Set();
    flights = flights.filter(f=>{ if(seen.has(f.id))return false; seen.add(f.id); return true; });
    flights.sort((a,b)=>(a.depMin||0)-(b.depMin||0));
    if(itinerary.length>0) document.getElementById('btn-back').style.display='';
    renderResults(flights);
  }catch(e){
    document.getElementById('results-card').innerHTML = `<div class="err"><i class="ti ti-alert-circle"></i> ${e.message}</div>`;
  }
}

function pickFlight(data){
  const f = JSON.parse(data);
  const waitMin = itinerary.length>0 ? f.depMin - itinerary[itinerary.length-1].arrMin : null;
  itinerary.push({...f, waitMin});
  legNum++; lastArrMin = f.arrMin; completed = false;
  renderItinerary();
  setNextLeg(f.to, f.arrMin);
}

function setNextLeg(fromAP, arrMin){
  const mct = getAP(fromAP).mct||20;
  document.getElementById('sel-from').value = fromAP;
  document.getElementById('sel-from').disabled = true;
  document.getElementById('sel-to').value = 'ALL';
  document.getElementById('sel-date').disabled = true;
  const tSel = document.getElementById('sel-time');
  const eStr = fromMin(arrMin+mct);
  let best = tSel.options[0].value;
  for(let i=0;i<tSel.options.length;i++){
    if(tSel.options[i].value<=eStr) best=tSel.options[i].value;
    else break;
  }
  tSel.value = best;
  document.getElementById('step-label').textContent = `第${legNum}便 — ${getAP(fromAP).name}発の乗継便を検索`;
  searchFlights();
}

function resetTool(){
  itinerary=[]; legNum=1; lastArrMin=0; completed=false;
  scheduleCache={};
  renderItinerary();
  document.getElementById('results-section').style.display='none';
  document.getElementById('step-label').textContent='第1便 — 検索条件を入力してください';
  document.getElementById('sel-from').disabled=false;
  document.getElementById('sel-to').disabled=false;
  document.getElementById('sel-date').disabled=false;
}

function goBack(){
  if(!itinerary.length) return;
  itinerary.pop(); legNum--; completed=false;
  if(!itinerary.length){resetTool();return;}
  const prev = itinerary[itinerary.length-1];
  lastArrMin = prev.arrMin;
  renderItinerary();
  setNextLeg(prev.to, prev.arrMin);
}

function completeItin(){
  if(!itinerary.length) return;
  completed=true;
  renderItinerary();
  document.getElementById('results-section').style.display='none';
  document.getElementById('itin-list').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderItinerary(){
  const el=document.getElementById('itin-list');
  const sum=document.getElementById('itin-summary');
  const bsec=document.getElementById('booking-section');
  const btnBack=document.getElementById('btn-back');
  const btnComplete=document.getElementById('btn-complete');
  const btnCopy=document.getElementById('btn-copy');
  if(!itinerary.length){
    el.innerHTML='<div class="itin-empty">便を選択すると旅程が表示されます</div>';
    sum.style.display='none'; bsec.style.display='none';
    btnBack.style.display='none'; btnComplete.style.display='none'; btnCopy.style.display='none';
    return;
  }
  let html='', tf=0, tw=0;
  itinerary.forEach((leg,i)=>{
    if(i>0&&leg.waitMin!=null){ html+=`<div class="transit-info"><i class="ti ti-clock" style="font-size:11px"></i> 乗り継ぎ待ち ${leg.waitMin}分　${getAP(leg.from).name}</div>`; tw+=leg.waitMin; }
    tf+=leg.dur;
    html+=`<div class="leg-row">
      <span class="leg-num">${i+1}</span>
      <span class="leg-al ${alCls(leg.airline)}">${leg.airline}</span>
      <span class="leg-flight">${leg.flight}</span>
      <div class="leg-route">
        <span class="leg-ap">${leg.from}</span><span class="leg-time">${leg.dep}</span>
        <span style="color:#ccc;font-size:12px"><i class="ti ti-arrow-right"></i></span>
        <span class="leg-ap">${leg.to}</span><span class="leg-time">${leg.arr}</span>
      </div>
    </div>`;
  });
  el.innerHTML=html;
  const tot=tf+tw;
  sum.style.display='flex';
  sum.innerHTML=`<span><i class="ti ti-plane" style="font-size:12px"></i>${itinerary.length}区間</span><span><i class="ti ti-clock" style="font-size:12px"></i>飛行 ${Math.floor(tf/60)}時間${tf%60}分</span><span><i class="ti ti-arrows-exchange" style="font-size:12px"></i>乗り継ぎ ${Math.floor(tw/60)}時間${tw%60}分</span><span><i class="ti ti-route" style="font-size:12px"></i>総所要 ${Math.floor(tot/60)}時間${tot%60}分</span>`;
  btnBack.style.display=''; btnCopy.style.display='';
  if(completed){ btnComplete.style.display='none'; bsec.style.display=''; renderBookingLinks(); }
  else{ btnComplete.style.display=''; bsec.style.display='none'; }
}

function renderResults(flights){
  const card=document.getElementById('results-card');
  if(!flights.length){
    card.innerHTML='<div class="no-result"><i class="ti ti-mood-empty"></i> この日・区間に運航便が見つかりませんでした。<br>日付・空港・航空会社の選択を変えてみてください。</div>';
    return;
  }
  let html='';
  flights.slice(0,40).forEach((f,i)=>{
    const waitNote = itinerary.length>0 ? ` ／ 待ち ${(f.depMin||0)-lastArrMin}分` : '';
    const safe = JSON.stringify(f).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html+=`<div class="result-item" data-f='${safe}'>
      <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap">
        <span style="font-size:11px;color:#aaa;min-width:18px">${i+1}</span>
        <span class="leg-al ${alCls(f.airline)}">${f.airline}</span>
        <span style="font-size:12px;color:#999;min-width:70px">${f.flight}</span>
        <span style="font-size:13px;font-weight:600">${f.from}</span>
        <i class="ti ti-arrow-right" style="font-size:12px;color:#ccc"></i>
        <span style="font-size:13px;font-weight:600">${f.to}</span>
        <span style="font-size:11px;color:#aaa">${getAP(f.to).name}</span>
      </div>
      <div class="ri-right">
        <div class="ri-times">${f.dep} → ${f.arr}</div>
        <div class="ri-sub">飛行 ${f.dur}分${waitNote}</div>
      </div>
    </div>`;
  });
  card.innerHTML=html;
  card.querySelectorAll('.result-item').forEach(el=>{
    el.addEventListener('click',()=>pickFlight(el.dataset.f));
  });
}

function renderBookingLinks(){
  const container=document.getElementById('booking-links');
  const dateDisp=searchDate.replace(/-/g,'/');
  let html='';
  itinerary.forEach((leg,i)=>{
    const jal=isJAL(leg.airline);
    const d=searchDate.replace(/-/g,'');
    const[y,mo,da]=searchDate.split('-');
    let url=jal
      ?`https://www.jal.co.jp/dom/reserve/search/?date=${d}&dep=${leg.from}&arr=${leg.to}&cabin=Y&adult=1`
      :`https://www.ana.co.jp/ja/jp/domtop/reserve/search/?depAirportCd=${leg.from}&arrAirportCd=${leg.to}&depDate=${y}${mo}${da}&adultNum=1&classCode=Y`;
    if(jal&&JAL_AFF_PARAM&&JAL_AFF_VALUE) url+=`&${JAL_AFF_PARAM}=${JAL_AFF_VALUE}`;
    html+=`<a class="booking-link ${jal?'booking-link-jal':'booking-link-ana'}" href="${url}" target="_blank" rel="noopener noreferrer">
      <div class="bl-info">
        <div class="bl-route">第${i+1}便　${leg.from} ${leg.dep} → ${leg.to} ${leg.arr}</div>
        <div class="bl-meta">${leg.flight}　${dateDisp}　${jal?'JAL 予約サイト':'ANA 予約サイト'}</div>
      </div>
      <span class="bl-badge ${jal?'bl-badge-jal':'bl-badge-ana'}">${leg.airline}</span>
      <i class="ti ti-external-link bl-icon"></i>
    </a>`;
  });
  container.innerHTML=html;
}

function copyItin(){
  if(!itinerary.length) return;
  const txt=itinerary.map((leg,i)=>{
    let s=''; if(i>0&&leg.waitMin) s+=`  乗り継ぎ待ち ${leg.waitMin}分\n`;
    return s+`第${i+1}便: ${leg.flight}  ${leg.from} ${leg.dep} → ${leg.to} ${leg.arr}`;
  }).join('\n');
  navigator.clipboard.writeText(txt).catch(()=>{});
  const btn=document.getElementById('btn-copy');
  btn.innerHTML='<i class="ti ti-check"></i> コピーしました';
  setTimeout(()=>{ btn.innerHTML='<i class="ti ti-copy"></i> 旅程をコピー'; },2000);
}

function init(){
  const from=document.getElementById('sel-from');
  const to=document.getElementById('sel-to');
  const unique=[]; const seen=new Set();
  AIRPORTS.forEach(ap=>{ if(!seen.has(ap.code)){ seen.add(ap.code); unique.push(ap); } });
  unique.sort((a,b)=>a.code.localeCompare(b.code));
  unique.forEach(ap=>{
    from.add(new Option(`${ap.code}　${ap.name}`,ap.code));
    to.add(new Option(`${ap.code}　${ap.name}`,ap.code));
  });
  to.insertBefore(new Option('全空港（乗継先）','ALL'),to.firstChild);
  from.value='HND'; to.value='ALL';
  const tSel=document.getElementById('sel-time');
  for(let h=4;h<24;h++) ['00','30'].forEach(m=>tSel.add(new Option(`${String(h).padStart(2,'0')}:${m}`,`${String(h).padStart(2,'0')}:${m}`)));
  tSel.value='07:00';
  const today=new Date();
  document.getElementById('sel-date').value=today.toISOString().slice(0,10);
  setAirline('JAL');
}
init();
</script>
